<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CNIT 131A Homework 9</title>
</head>
<body>

    <h1>SVG Files in CNIT 131A</h1>

    <p>
        This page shpws my work with SVG graphics. The shapes I made
        using inline SVG code written directly in HTML is shown. This code helps accurately choose
        any colors, borders, and gradients without needing external image files.
    </p>


    
    <svg width="500" height="300">

       
        <rect x="20" y="20" width="120" height="80"
              fill="blue" stroke="pink" stroke-width="4" />

       
        <circle cx="250" cy="60" r="40"
                fill="yellow" stroke="blue" stroke-width="4" />

        <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:purple; stop-opacity:1" />
                <stop offset="100%" style="stop-color:orange; stop-opacity:1" />
            </linearGradient>
        </defs>

        <polygon points="150,150 200,220 100,220"
                 fill="url(#grad1)" stroke="black" stroke-width="2" />

    </svg>

</body>
</html>
